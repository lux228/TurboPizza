name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour GitHub Pages et Releases
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          
      - name: Disable Flutter analytics
        run: flutter config --no-analytics
          
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run tests
        run: flutter test

  build-windows:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    timeout-minutes: 40
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
          
      - name: Disable Flutter analytics
        run: flutter config --no-analytics
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        
      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboPizza-Windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
        
      - name: Create Windows ZIP
        if: github.event_name == 'release'
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../TurboPizza-Windows-${{ github.event.release.tag_name }}.zip *
        
      - name: Upload Windows ZIP to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TurboPizza-Windows-${{ github.event.release.tag_name }}.zip
